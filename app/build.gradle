plugins {
    id 'com.android.application'
}

android {
    namespace 'com.advancedhome.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.advancedhome.tv'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
